[project]
name = "pitchside"
version = "0.1.0"
description = "European football match outcome predictor"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "soccerdata",
    "duckdb",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchside"]
