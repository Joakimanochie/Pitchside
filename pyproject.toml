[project]
name = "pitchside"
version = "0.1.0"
description = "European football match outcome predictor"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "psycopg[binary]>=3.3.6",
    "scipy>=1.17.1",
    "soccerdata",   # only the daily goal-minutes step uses it (Understat)
]

[dependency-groups]
# Not needed by the scheduled job: tests (pgserver) and local analysis (duckdb).
dev = [
    "pgserver>=0.1.4",
    "pytest",
    "ruff",
    "duckdb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchside"]
