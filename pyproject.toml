[project]
name = "pitchside"
version = "0.1.0"
description = "European football match outcome predictor"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "soccerdata",
    "duckdb",
    "psycopg[binary]>=3.3.6",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.3.6",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchside"]
