name: Pitchside lineups

# Every 30 minutes: when a club has named its team for a match starting within three hours, store the lineup, re-price that match's player
# markets with it, and (only then) refresh and redeploy the site. Most runs find nothing new and finish in about a minute.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Shares the daily pipeline's lock: never two jobs writing to the database at once.
concurrency:
  group: pitchside-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install runtime dependencies only
        run: uv sync --frozen --no-dev

      - name: Store new lineups and re-price player markets
        id: lineups
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          uv run --frozen --no-dev python -m pitchside.pipeline.lineups | tee report.txt
          grep '^new_lineups=' report.txt >> "$GITHUB_OUTPUT"

      - name: Export the web app data
        if: ${{ steps.lineups.outputs.new_lineups != '0' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --frozen --no-dev python scripts/export_app_data.py

      - uses: actions/setup-node@v4
        if: ${{ steps.lineups.outputs.new_lineups != '0' && env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Build and deploy the web app
        if: ${{ steps.lineups.outputs.new_lineups != '0' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: web/app
        env:
          CLOUDFLARE_ACCOUNT_ID: 732527cd8d00cefae7077399663914e8
        run: |
          npm ci
          npm run build
          npx wrangler deploy

  alert:
    needs: lineups
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Lineups job failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The lineups run failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
