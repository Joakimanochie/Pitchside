name: Odds feed probe

# Checks what OddsPapi covers (SportyBet, markets, lines) using the ODDS_API_KEY secret; prints no secret. Safe to delete once a feed is chosen.
# Runs by hand, and every morning for about a week while the real feed is built into the daily pipeline. Each run uses about 5 of the free plan's 250 requests a month
# (about 35 for the week); delete this file, or at least the schedule, once the pipeline reads prices itself.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe OddsPapi
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/probe_oddspapi.py
